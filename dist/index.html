<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Skills Handbook</title>
  <link rel="stylesheet" href="styles.css?v=form-edit16" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <h1>My Skills Handbook</h1>
        <nav class="tabs" aria-label="Runtime">
          <button type="button" data-runtime="cursor" class="active">Cursor</button>
          <button type="button" data-runtime="claude">Claude</button>
          <button type="button" data-runtime="config">Tailwind config</button>
        </nav>
      </div>
      <div class="header-tools">
        <p id="meta" class="meta">Loading…</p>
        <button type="button" id="settings-btn" class="settings-btn" aria-haspopup="dialog" aria-controls="settings-panel" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.22-1.13.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.6.22l2.39-.96c.5.41 1.05.72 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.58-.22 1.13-.53 1.63-.94l2.39.96c.17.12.46.02.6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
          </svg>
          <span>Settings</span>
        </button>
      </div>
    </header>

    <div id="settings-backdrop" class="settings-backdrop hidden" hidden></div>
    <aside id="settings-panel" class="settings-panel hidden" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-header">
        <h2 id="settings-title">Settings</h2>
        <button type="button" id="settings-close" class="settings-close" aria-label="Close settings">×</button>
      </div>
      <div id="settings-body" class="settings-body"></div>
    </aside>

    <div id="edit-backdrop" class="edit-backdrop hidden" hidden></div>
    <div id="edit-modal" class="edit-modal hidden" hidden role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <div class="edit-modal-header">
        <div class="edit-modal-heading">
          <h2 id="edit-title">Edit configuration</h2>
          <p id="edit-file-path" class="edit-file-path" hidden></p>
        </div>
        <button type="button" id="edit-close" class="settings-close" aria-label="Close editor">×</button>
      </div>
      <div id="edit-modal-body" class="edit-modal-body"></div>
      <div class="edit-modal-footer">
        <p id="edit-status" class="settings-note" role="status"></p>
        <div class="settings-edit-actions">
          <button type="button" id="edit-cancel" class="settings-secondary">Cancel</button>
          <button type="button" id="edit-save" class="settings-primary">Save and refresh catalog</button>
        </div>
      </div>
    </div>

    <div id="runtime-pane" class="runtime-pane">
      <nav id="section-tabs" class="subtabs" aria-label="Section">
        <button type="button" data-section="skills" class="active">Skills</button>
        <button type="button" data-section="rules">Rules</button>
      </nav>

      <section id="skills-view" class="view">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search name, category, description, MCP…" autocomplete="off" />
          <div class="filter-links origin" role="group" aria-label="Filter by source">
            <span class="filter-label" title="Filter by source" aria-hidden="true">
              <svg class="filter-icon" viewBox="0 0 16 16" width="14" height="14">
                <path fill="currentColor" d="M1.5 2.5h13l-5 5.5V13l-3 1.5V8L1.5 2.5z"/>
              </svg>
            </span>
            <button type="button" data-origin="all" class="active">All</button>
            <span class="filter-sep" aria-hidden="true">·</span>
            <button type="button" data-origin="personal">Personal</button>
            <span class="filter-sep" aria-hidden="true">·</span>
            <button type="button" data-origin="tailwind">Tailwind</button>
          </div>
        </div>
        <div id="cat-filters" class="filter-group cats" role="group" aria-label="Category filter"></div>
        <div id="count" class="count"></div>
        <div class="table-wrap">
          <table id="skills-table" class="resizable">
            <colgroup>
              <col class="col-toggle" style="width: 2.5rem" />
              <col class="col-name" data-col="skills-name" style="width: 18%" />
              <col class="col-cat" data-col="skills-cat" style="width: 16%" />
              <col class="col-desc" data-col="skills-desc" style="width: auto" />
            </colgroup>
            <thead>
              <tr>
                <th class="col-toggle" aria-label="Expand"></th>
                <th class="col-name" data-col="skills-name">Name<span class="col-resizer" data-resize="skills-name"></span></th>
                <th class="col-cat" data-col="skills-cat">Categories<span class="col-resizer" data-resize="skills-cat"></span></th>
                <th class="col-desc" data-col="skills-desc">Description</th>
              </tr>
            </thead>
            <tbody id="skills-body"></tbody>
          </table>
        </div>
      </section>

      <section id="rules-view" class="view hidden">
        <div class="toolbar">
          <input id="rules-search" type="search" placeholder="Search rules…" autocomplete="off" />
        </div>
        <div id="rules-count" class="count"></div>
        <div class="table-wrap">
          <table id="rules-table" class="resizable">
            <colgroup>
              <col class="col-toggle" style="width: 2.5rem" />
              <col class="col-name" data-col="rules-name" style="width: 28%" />
              <col class="col-desc" data-col="rules-desc" style="width: auto" />
            </colgroup>
            <thead>
              <tr>
                <th class="col-toggle" aria-label="Expand"></th>
                <th class="col-name" data-col="rules-name">Name<span class="col-resizer" data-resize="rules-name"></span></th>
                <th class="col-desc" data-col="rules-desc">Description</th>
              </tr>
            </thead>
            <tbody id="rules-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <section id="config-view" class="view hidden">
      <div class="toolbar">
        <input id="config-search" type="search" placeholder="Search config name, value, path…" autocomplete="off" />
        <div class="filters origin" id="config-source-filters" role="group" aria-label="Config source filter"></div>
      </div>
      <div id="config-count" class="count"></div>
      <div class="table-wrap">
        <table id="config-table" class="resizable">
          <colgroup>
            <col class="col-toggle" style="width: 2.5rem" />
            <col class="col-name" data-col="config-name" style="width: 28%" />
            <col class="col-desc" data-col="config-value" style="width: auto" />
          </colgroup>
          <thead>
            <tr>
              <th class="col-toggle" aria-label="Expand"></th>
              <th class="col-name" data-col="config-name">Name<span class="col-resizer" data-resize="config-name"></span></th>
              <th class="col-desc" data-col="config-value">Value</th>
            </tr>
          </thead>
          <tbody id="config-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="app.js?v=form-edit19"></script>
</body>
</html>
